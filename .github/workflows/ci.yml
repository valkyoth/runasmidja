name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: git show --check --format= HEAD
      - run: rustup show
      - run: rustup target add thumbv7em-none-eabihf wasm32-unknown-unknown
      - run: scripts/install_python_tools.sh
      - run: scripts/checks.sh
      - run: python3 scripts/smoke_probe.py
      - run: scripts/install_ci_tools.sh
      - run: cargo deny check
      - run: cargo audit --deny warnings
      - run: scripts/generate-sbom.sh
