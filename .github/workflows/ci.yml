name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: rustup target add thumbv7em-none-eabihf wasm32-unknown-unknown
      - run: scripts/checks.sh
      - run: python3 scripts/smoke_probe.py
      - run: scripts/install_ci_tools.sh
      - run: cargo deny check
      - run: cargo audit --deny warnings
      - run: scripts/generate-sbom.sh
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y podman openssl skopeo
      - name: Enable delegated user build cgroups
        run: |
          sudo loginctl enable-linger "$USER"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - run: rustup target add x86_64-unknown-linux-musl
      - run: python3 scripts/smoke_probe.py --container
      - run: python3 scripts/install_image_tools.py
      - run: python3 scripts/stack_qualification.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-image-sboms
          path: .local/image-evidence/*.cdx.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - if: always()
        run: python3 scripts/stack.py stop
